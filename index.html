<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>譜めくり</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D6A63">
<meta name="description" content="PDFや紙の楽譜を取り込んで、めくって、書き込める楽譜ビューア。iPad・iPhone・Androidで使えて、無料・登録不要・オフライン対応。">
<meta property="og:type" content="website">
<meta property="og:title" content="譜めくり — 楽譜ビューア">
<meta property="og:description" content="PDFや紙の楽譜を取り込んで、めくって、書き込める。iPad・iPhone・Android対応、無料・登録不要・オフライン対応。">
<meta property="og:url" content="https://satorun-run.github.io/fumekuri/">
<meta property="og:image" content="https://satorun-run.github.io/fumekuri/promo/og.png">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="譜めくり">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<script>
/* Requirement check: PDF.js 3.11 needs Safari 15.4+ / Chrome 92+. Show a clear message instead of a blank screen. */
(function () {
  var ok;
  try {
    ok = typeof Array.prototype.at === 'function' && 'indexedDB' in window;
    new Function('class A{#a(){return 1}static b(){return new A().#a()}}');
  } catch (e) { ok = false; }
  if (ok) return;
  window.__fmkUnsupported = true;
  document.addEventListener('DOMContentLoaded', function () {
    document.body.innerHTML = '<div style="position:fixed;top:0;right:0;bottom:0;left:0;overflow:auto;background:#EDF0F2;color:#17202A;padding:40px 20px;font:16px/1.7 sans-serif">'
      + '<div style="max-width:560px;margin:0 auto;background:#fff;border:1px solid #D2D9DF;border-radius:14px;padding:24px">'
      + '<h1 style="font-size:22px;margin:0 0 12px">この端末では譜めくりを使えません</h1>'
      + '<p style="margin:0 0 12px">お使いのブラウザが古いため、楽譜を表示できません。次のバージョンに更新してください。</p>'
      + '<ul style="margin:0 0 12px;padding-left:1.2em"><li>iPad・iPhone：iPadOS / iOS 15.4 以降<br><small>「設定」→「一般」→「ソフトウェアアップデート」で更新できます</small></li><li>Android：Chrome 92 以降</li></ul>'
      + '<p style="margin:0;color:#56626E;font-size:14px">iPad Air 2・iPad mini 4 以降の iPad、iPhone 6s 以降の iPhone なら、無料のアップデートで使えるようになります。</p>'
      + '</div></div>';
  });
})();
</script>
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main id="view"></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div id="full" hidden></div>
<div id="sheet-root" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="drop" hidden>PDFをここにドロップして取り込み</div>

<input type="file" id="inPdf" accept="application/pdf,.pdf,application/json,.json" multiple hidden>
<input type="file" id="inCam" accept="image/*" capture="environment" hidden>
<input type="file" id="inPhotos" accept="image/*" multiple hidden>
<input type="file" id="inRestore" hidden>

<script src="vendor/pdf.min.js"></script>
<script src="vendor/pdf-lib.min.js"></script>
<script src="app.js"></script>
</body>
</html>
