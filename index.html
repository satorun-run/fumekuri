<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>譜めくり</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D6A63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="譜めくり">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main id="view"></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div id="full" hidden></div>
<div id="sheet-root" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="drop" hidden>PDFをここにドロップして取り込み</div>

<input type="file" id="inPdf" accept="application/pdf,.pdf,application/json,.json" multiple hidden>
<input type="file" id="inCam" accept="image/*" capture="environment" hidden>
<input type="file" id="inPhotos" accept="image/*" multiple hidden>
<input type="file" id="inRestore" hidden>

<script src="vendor/pdf.min.js"></script>
<script src="vendor/pdf-lib.min.js"></script>
<script src="app.js"></script>
</body>
</html>
